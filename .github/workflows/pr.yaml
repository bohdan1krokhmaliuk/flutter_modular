name: PR

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "🔍 Analyze"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🧪 Run Analyze"
        run: melos run analyze:diff

  unused-dependencies:
    name: "📦 Unused Dependencies"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🕵️ Validate Dependencies"
        run: melos run unused_dependencies:diff

  circular-dependencies:
    name: "🔄 Circular Dependencies"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/init
      - name: "🕵️ Run"
        run: melos run circular_dependencies:diff

  barrel-files-imports:
    name: "🛢️ Barrel files check"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🚧 Validate Barrels"
        run: melos run validate_barrel_file_imports:diff

  unused-files:
    name: "📂 Unused Files"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🧹 Hunt Unused Files"
        run: melos run unused_files:diff

  unused-code:
    name: "✂️ Unused Code"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🪓 Hunt Unused Code"
        run: melos run unused_code:diff

  unit-tests:
    name: "🚦 Unit Tests"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🏎️ Run Tests"
        run: melos run test:diff

  coverage:
    name: "📊 Coverage Report"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "🚚 Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: "🏗️ Prepare Environment"
        uses: ./.github/actions/init
      - name: "🧪 Generate Coverage"
        run: melos run coverage:diff
      - name: "📝 Prepare Report"
        id: coverage_report
        run: |
          dart .tools/scripts/calculate_coverage.dart > coverage_summary.md
          cat coverage_summary.md >> $GITHUB_STEP_SUMMARY
      - name: "💬 Post/Update Coverage Comment"
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: coverage_summary.md
